services:
  draft-site:
    build:
      context: /tank/projects/draft-site/repo
      dockerfile: docker/Dockerfile
    image: local/draft-site:latest
    container_name: draft-site
    restart: unless-stopped
    user: "10001:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "127.0.0.1:8742:8742"
    environment:
      DRAFT_DATA_DIR: /data
      DRAFT_SECRETS_DIR: /secrets
      DRAFT_PUBLIC_URL: https://draft.bertholomus.com
      DRAFT_REQUIRE_ORIGIN_AUTH: "1"
      DRAFT_BOOTSTRAP_WORKER_KEYS: "0"
      DRAFT_LABEL_TRUSTED_LOGINS: "bertholomus-w1"
      DRAFT_NON_OWNER_KINDS: "drafter-label"
      DRAFT_MAX_CLAIMS_PER_LOGIN: "2"
      DRAFT_MAX_STRIKES: "3"
    volumes:
      - /tank/projects/draft-site/data:/data:rw
      - /tank/projects/draft-site/secrets/server:/secrets:ro
